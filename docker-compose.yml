services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: flamelens-api:local
    container_name: flamelens_backend
    restart: unless-stopped
    environment:
      APP_NAME: FlameLens
      APP_VERSION: 0.1.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      API_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Browser origins allowed to call the API. Add the deployed frontend URL
      # (for example https://your-frontend.vercel.app) for remote deployments.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      FLAMELENS_METADATA_DIR: /app/data/metadata
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Optional: use updated inventories without rebuilding the image. The
      # image already contains a copy of the four JSON files.
      - ./data/metadata:/app/data/metadata:ro
